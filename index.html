<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#5bbd59" />
  <title>Sion y los Medios de Comunicación</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Juego educativo Sion y los Medios de Comunicación"></canvas>

    <div id="hud">
      <div class="player-card">
        <div class="mini-sion" aria-hidden="true"></div>
        <div><strong>Sion</strong><div>⭐ <span id="stars">0</span></div></div>
      </div>
      <div class="mission-card">
        <div class="mission-title">Misión</div>
        <div id="missionText">Explora el pueblo</div>
        <div id="progressRow"></div>
      </div>
      <button id="soundBtn" class="round-btn" aria-label="Activar o desactivar sonido">🔊</button>
    </div>

    <div id="joystick" class="joystick" aria-label="Joystick digital">
      <div class="joy-ring"></div>
      <div id="joyKnob" class="joy-knob"></div>
    </div>

    <div id="actions">
      <button id="talkBtn" class="action-btn talk"><span>💬</span><b>Hablar</b></button>
      <button id="useBtn" class="action-btn use"><span>☝️</span><b>Usar</b></button>
    </div>

    <div id="dialog" class="modal hidden" role="dialog" aria-modal="true">
      <div class="dialog-box">
        <div id="speaker" class="speaker">Sion</div>
        <div id="dialogText" class="dialog-text"></div>
        <div id="dialogChoices" class="choices"></div>
        <button id="dialogNext" class="primary-btn">Continuar</button>
      </div>
    </div>

    <div id="startScreen" class="start-screen">
      <div class="start-panel">
        <div class="hero-sion" aria-hidden="true"></div>
        <h1>Sion y los Medios de Comunicación</h1>
        <p>Ayuda a Sion a devolver la comunicación al pueblo.</p>
        <div class="badges">📻 📺 📱 💻 📰 ✉️</div>
        <button id="startBtn" class="primary-btn big">▶ Jugar</button>
        <p class="hint">Tablet: usa el joystick y los botones. Computadora: flechas/WASD + E/Q.</p>
      </div>
    </div>

    <div id="rotateHint">↻ Gira la tablet para jugar mejor en horizontal</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
